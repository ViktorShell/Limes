[package]
name = "limes"
version = "0.2.0"
edition = "2021"
authors = ["Enrico Fiasco <e.fiasco@studenti.unipi.it>"]
description = "Limes — FaaS executor for Wasm modules with SLLM/LLM support"

[[bin]]
name = "limes-server"
path = "src/main.rs"

[[bin]]
name = "limes-run"
path = "src/limes-run.rs"

[dependencies]
axum = "0.7"
bytes = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nanoid = "0.4"
uuid = { version = "1", features = ["v4"] }
crc32fast = "1"
rig-core = "0.32.0"
wasmtime = "42.0.1"
wasmtime-wasi = "42.0.1"
log = "0.4.29"
env_logger = "0.11.9"
